<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" role="img" aria-labelledby="title desc">
  <title id="title">Working toolkit</title>
  <desc id="desc">Python, SQL, JavaScript, and C++. Data extraction, cleaning, validation, and transformation. The animation is decorative and does not represent proficiency or performance.</desc>
  <defs>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="960" y2="0">
      <stop offset="0" stop-color="#61D8EF">
        <animate attributeName="stop-color" values="#61D8EF;#FFD582;#61D8EF" dur="28s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
      </stop>
      <stop offset="0.5" stop-color="#C09AFF"/>
      <stop offset="1" stop-color="#FFD582">
        <animate attributeName="stop-color" values="#FFD582;#61D8EF;#FFD582" dur="28s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow"><stop stop-color="#C09AFF" stop-opacity="0.2"/><stop offset="1" stop-color="#101E32" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFF5E9" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="960" height="220" rx="20" fill="#101E32"/>
  <ellipse cx="691.1999999999999" cy="88.0" rx="432.0" ry="165.0" fill="url(#glow)"/>
  <rect width="960" height="220" rx="20" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="959" height="219" rx="20" fill="none" stroke="#344C6B"/>
  <text x="40" y="40" font-family="Consolas, Liberation Mono, monospace" font-size="12" fill="#61D8EF" letter-spacing="2">WORKING TOOLKIT</text>
  <rect x="40" y="66" width="208" height="40" rx="8" fill="#3B3028" stroke="#FFD582" stroke-opacity="0.4"/>
  <text x="56" y="93" font-family="Consolas, Liberation Mono, monospace" font-size="18" fill="#FFD582" >Python</text>
  <rect x="264" y="66" width="208" height="40" rx="8" fill="#193B4C" stroke="#61D8EF" stroke-opacity="0.4"/>
  <text x="280" y="93" font-family="Consolas, Liberation Mono, monospace" font-size="18" fill="#61D8EF" >SQL</text>
  <rect x="488" y="66" width="208" height="40" rx="8" fill="#30294E" stroke="#C09AFF" stroke-opacity="0.4"/>
  <text x="504" y="93" font-family="Consolas, Liberation Mono, monospace" font-size="18" fill="#C09AFF" >JavaScript</text>
  <rect x="712" y="66" width="208" height="40" rx="8" fill="#3E293C" stroke="#FFA5A9" stroke-opacity="0.4"/>
  <text x="728" y="93" font-family="Consolas, Liberation Mono, monospace" font-size="18" fill="#FFA5A9" >C++</text>
  <path d="M54 158H904" fill="none" stroke="url(#accent)" stroke-width="1.5"/>
  <circle r="4" fill="#61D8EF" opacity="0.85">
      <animateMotion path="M54 158H904" dur="30s" begin="0s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0;1" keyPoints="0;1" keySplines="0.42 0 0.58 1"/>
      <animate attributeName="opacity" values="0;0.85;0.85;0" dur="30s" begin="0s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0;0.12;0.88;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/>
    </circle>
  <circle cx="54" cy="158" r="5" fill="#101E32" stroke="#61D8EF" stroke-width="1.5"/>
  <text x="54" y="187" font-family="Consolas, Liberation Mono, monospace" font-size="12" fill="#B4C6DF" text-anchor="start" letter-spacing="1">EXTRACT</text>
  <circle cx="324" cy="158" r="5" fill="#101E32" stroke="#61D8EF" stroke-width="1.5"/>
  <text x="324" y="187" font-family="Consolas, Liberation Mono, monospace" font-size="12" fill="#B4C6DF" text-anchor="start" letter-spacing="1">CLEAN</text>
  <circle cx="594" cy="158" r="5" fill="#101E32" stroke="#61D8EF" stroke-width="1.5"/>
  <text x="594" y="187" font-family="Consolas, Liberation Mono, monospace" font-size="12" fill="#B4C6DF" text-anchor="start" letter-spacing="1">VALIDATE</text>
  <circle cx="864" cy="158" r="5" fill="#101E32" stroke="#61D8EF" stroke-width="1.5"/>
  <text x="864" y="187" font-family="Consolas, Liberation Mono, monospace" font-size="12" fill="#B4C6DF" text-anchor="end" letter-spacing="1">TRANSFORM</text>
</svg>
