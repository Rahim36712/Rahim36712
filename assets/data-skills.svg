<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" role="img" aria-labelledby="title desc">
  <title id="title">Working toolkit</title>
  <desc id="desc">Python, SQL, JavaScript, and C++. Data extraction, cleaning, validation, and transformation. The animation is decorative and does not represent proficiency or performance.</desc>
  <defs>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="960" y2="0">
      <stop offset="0" stop-color="#8BD5C5">
        <animate attributeName="stop-color" values="#8BD5C5;#D6A17B;#8BD5C5" dur="28s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
      </stop>
      <stop offset="1" stop-color="#D6A17B">
        <animate attributeName="stop-color" values="#D6A17B;#8BD5C5;#D6A17B" dur="28s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
      </stop>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#F5F0E8" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="960" height="220" rx="20" fill="#142B32"/>
  <rect width="960" height="220" rx="20" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="959" height="219" rx="20" fill="none" stroke="#345057"/>
  <text x="40" y="40" font-family="Consolas, Liberation Mono, monospace" font-size="12" fill="#8BD5C5" letter-spacing="2">WORKING TOOLKIT</text>
  <rect x="40" y="66" width="208" height="40" rx="8" fill="#1B363D" stroke="#345057"/>
  <text x="56" y="93" font-family="Consolas, Liberation Mono, monospace" font-size="18" fill="#F5F0E8" >Python</text>
  <rect x="264" y="66" width="208" height="40" rx="8" fill="#1B363D" stroke="#345057"/>
  <text x="280" y="93" font-family="Consolas, Liberation Mono, monospace" font-size="18" fill="#F5F0E8" >SQL</text>
  <rect x="488" y="66" width="208" height="40" rx="8" fill="#1B363D" stroke="#345057"/>
  <text x="504" y="93" font-family="Consolas, Liberation Mono, monospace" font-size="18" fill="#F5F0E8" >JavaScript</text>
  <rect x="712" y="66" width="208" height="40" rx="8" fill="#1B363D" stroke="#345057"/>
  <text x="728" y="93" font-family="Consolas, Liberation Mono, monospace" font-size="18" fill="#F5F0E8" >C++</text>
  <path d="M54 158H904" fill="none" stroke="url(#accent)" stroke-width="1.5"/>
  <circle r="4" fill="#8BD5C5" opacity="0.85">
      <animateMotion path="M54 158H904" dur="30s" begin="0s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0;1" keyPoints="0;1" keySplines="0.42 0 0.58 1"/>
      <animate attributeName="opacity" values="0;0.85;0.85;0" dur="30s" begin="0s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0;0.12;0.88;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/>
    </circle>
  <circle cx="54" cy="158" r="5" fill="#142B32" stroke="#8BD5C5" stroke-width="1.5"/>
  <text x="54" y="187" font-family="Consolas, Liberation Mono, monospace" font-size="12" fill="#A9BEBC" text-anchor="start" letter-spacing="1">EXTRACT</text>
  <circle cx="324" cy="158" r="5" fill="#142B32" stroke="#8BD5C5" stroke-width="1.5"/>
  <text x="324" y="187" font-family="Consolas, Liberation Mono, monospace" font-size="12" fill="#A9BEBC" text-anchor="start" letter-spacing="1">CLEAN</text>
  <circle cx="594" cy="158" r="5" fill="#142B32" stroke="#8BD5C5" stroke-width="1.5"/>
  <text x="594" y="187" font-family="Consolas, Liberation Mono, monospace" font-size="12" fill="#A9BEBC" text-anchor="start" letter-spacing="1">VALIDATE</text>
  <circle cx="864" cy="158" r="5" fill="#142B32" stroke="#8BD5C5" stroke-width="1.5"/>
  <text x="864" y="187" font-family="Consolas, Liberation Mono, monospace" font-size="12" fill="#A9BEBC" text-anchor="end" letter-spacing="1">TRANSFORM</text>
</svg>
