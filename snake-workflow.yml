# Reference copy. The active workflow lives at .github/workflows/snake.yml.
name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml
      - scripts/style_snake.py

permissions:
  contents: read

concurrency:
  group: profile-contribution-snake
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out build scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: source

      - name: Generate contribution calendar animation
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#9C405E&color_dots=#e7eaf2,#bce7ef,#a8b7ed,#bd92da,#925ba8
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FFA5A9&color_dots=#19263b,#21495e,#397489,#7b6baa,#C09AFF

      - name: Slow the loop and create reduced-motion images
        run: python source/scripts/style_snake.py --directory dist

      - name: Check out published images
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: output
          path: published

      - name: Publish generated images
        shell: bash
        run: |
          cp dist/*.svg published/
          cd published
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg github-contribution-grid-snake-static.svg github-contribution-grid-snake-dark-static.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh contribution snake artwork"
            git push origin HEAD:output
          fi
